[package]
name = "iris-client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
env_logger = "0.11.8"
log = "0.4.27"

tokio = { version = "1.45.0", features = ["rt-multi-thread"] }
tonic = { version =  "0.13.0", features = ["transport", "tls-ring"] }
openssl = "0.10.72"
prost = "0.13.1"
reed-solomon-16  = "0.1.0"
grid = "0.16.2"
crossbeam-channel = "0.5.15"

iris-shared = {version = "0.1.0" , path = "../shared-lib"}

clap = "4.5.37"
once_cell = "1.21.3"
chrono = "0.4.41"
flate2 = "1.1.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
mio = {version =  "1.0.3", features = ["os-poll", "net"]}
dashmap = "6.1.0"
socket2 = "0.6.0"
pnet_datalink = "0.35.0"
loole = "0.4.1"
uuid = { version = "1.17.0", features = ["v4"] }
futures = "0.3.31"
futures-util = "0.3.31"

# This compiles openssl for android using NDK
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10.72", features = ["vendored"] }

[build-dependencies]
tonic-build = "0.13.1"
