services:
  streaming-server:
    image: iris/server:0.1.0
    container_name: streaming-server
    build: 
      context: ./iris
      dockerfile: server/Dockerfile
    ports:
      - "50051:50051"
    volumes:
      - ./iris/server/config.toml:/home/appuser/server/config.toml
    networks:
      iris-network:
        ipv4_address: 172.22.0.102

  client:
    image: iris/client:0.1.0
    build:
      context: ./iris
      dockerfile: client/Dockerfile
    deploy:
      replicas: 5  # Replace 5 with your desired number of replicas (N)
    extra_hosts:
      - "stream1.iris.dcc.fc.up.pt:172.22.0.102" # Very important because of the tls certificate
    environment:
      SERVER_IP: "stream1.iris.dcc.fc.up.pt"
    restart: on-failure
    networks:
      - iris-network

networks:
  iris-network:
    external: true
