[package]
name = "iris-client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
env_logger = "0.11.5"
log = "0.4.22"
tokio-util = { version = "0.7.11", features = ["full"] }
tokio = { version = "1.39.3", features = ["macros", "rt-multi-thread"] }
tonic-reflection = "0.12.1"
tonic = { version =  "0.12.1", features = ["transport", "tls"] }
mio = {version =  "1.0.2", features = ["os-poll", "net"]}
openssl = "0.10.66"
prost = "0.13.1" # tonic uses this, but needs a trait implementation todo!()
reed-solomon-16  = "0.1.0"
grid = "0.14.0"
crossbeam-channel = "0.5.13"

iris-shared = {version = "0.1.0" , path = "../shared-lib"}


serde = { version = "1.0.209", features = ["derive"] }
toml = "0.8.19"
clap = "4.5.16"
rand = "0.8.5"
once_cell = "1.19.0"
pnet = "0.35.0"
pnet_datalink = "0.35.0"
rayon = "1.10.0"

# This compiles openssl for android using NDK
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10.66", features = ["vendored"] }

[build-dependencies]
tonic-build = "0.12.1"
