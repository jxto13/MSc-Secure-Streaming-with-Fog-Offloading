[package]
name = "rustapp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
android_logger = "0.13.1"
chrono = "0.4.26"
jni = "0.21.1"
log = "0.4.19"
notify = { version = "6.0.1", features = ["serde"] }
serde_json = "1.0.99"
tokio = { version = "1.28.2", features = ["macros", "rt-multi-thread"] }
tonic = "0.11.0"
prost = "0.12"

serde = "1.0.196"
rand = { version = "0.8", package = "rand" }
hex = "0.4"
mio = "0.8.11"
mpeg2ts = "0.3.1"
# reqwest = "0.12.4"
openssl = { version = "0.10.64", features = ["vendored"] }
reqwest = "0.12.4"
reed-solomon-16  = "0.1.0"

# [dependencies.pnet]
# version = "0.34.0"

[build-dependencies]
tonic-build = "0.11.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
