[package]
name = "iris-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
env_logger = "0.11.8"
log = "0.4.27"
tokio-util = { version = "0.7.15", features = ["full"] }
tokio = { version = "1.45.0", features = ["rt-multi-thread"] }
tonic = { version =  "0.13.1", features = ["transport", "tls-ring"] }
mio = {version =  "1.0.4", features = ["os-poll", "net"]}
openssl = "0.10.73"
prost = "0.13.1"
reed-solomon-16  = "0.1.0"
grid = "0.18.0"
crossbeam-channel = "0.5.15"

iris-shared = {version = "0.1.0" , path = "../shared-lib"}

serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.4"
clap = "4.5.42"
rand = "0.9.2"
once_cell = "1.21.3"
pnet = "0.35.0"
prometheus_exporter = "0.8.5"
chrono = "0.4.41"
dashmap = "6.1.0"
flate2 = "1.1.2"
rurel = "0.6.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
hex = "0.4.3"
serde_json = "1.0.142"

# This compiles openssl for android using NDK
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10.73", features = ["vendored"] }

[build-dependencies]
tonic-build = "0.13.1"

[[bin]]
name = "streaming_server"
path = "./src/main.rs"
