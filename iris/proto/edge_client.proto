syntax = "proto3";
package edge_client;

// The MeshPacket message represents a data packet with time-to-live (TTL) and payload.
message MeshPacket {
    int32 ttl = 1;
    oneof packet_type {
        RetransmissionRequest request = 2; // Request for retransmission
        RetransmissionResponse response = 3; // Response to a retransmission request
        HeartbeatPacket heartbeat = 4; // Heartbeat packet to maintain connection
    }
}

message HeartbeatPacket {
    string uuid = 1;
    string addr = 2; 
    repeated string peers = 3; // optional: list of peer UUIDs this node knows (routing hint)
}


message RetransmissionRequest {
    int32 matrix = 1; // the matrix index
    int32 packet = 2; // the index of the packet in the matrix
}

message RetransmissionResponse {
    bytes payload = 1; // The actual data of the retransmitted packet
}