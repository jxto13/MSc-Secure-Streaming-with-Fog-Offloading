services:
    restreamer:
      container_name: restreamer
      image: datarhei/restreamer:latest
      volumes:
            - ./config:/core/config
            - ./data:/core/data
      ports:
          - 8080:8080
          - 8181:8181
          - 1935:1935
      privileged: true
      networks: 
        iris-network:
            ipv4_address: 172.22.0.101
      restart: always


networks:
  iris-network:
    external: true
