[ca]
c = "PT"
st = "Porto"
o = "DCC"
cn = "iris.dcc.fc.up.pt"

[server_cert]
c = "PT"
st = "Porto"
o = "DCC"
cn = "stream1.iris.dcc.fc.up.pt"

[grpc]
port = 50051 # service port

[unicast]
port = 50052 # unicast port for retransmissions

[multicast]
# Stream Config
data_source = "udp"

# This ip source is for docker network
# ip_source = "172.22.0.102:1234"

# This ip source is local development
ip_source = "172.22.0.1:1234"

# Multicast Config
interface = "veth0" 
# interface = "wlp92s0"
# interface = "eth0"
# interface = "enp0s20f0u3u1u3"

ip_multicast = "239.255.0.1:12345"
bitrate = 30000 # kbit/s

# Matrix Config
row = 10
col = 10
row_fec = 5 # can be 0 if network loss allows it
col_fec = 5 # can be 0 if network loss allows it

epoch = 10 # number of matrix to rotate encryption key

# This is the protocol defined, this is optimized for MTU 1500, can be easily changed with another MTU size
data_size = 940 # 188 x 5, this is 5 ts packets
shard_size = 1088 # must be a multiple of 64 but needs to be bigger then data and have space for signatures and next_key, 
                  # max size of signature is 65 bytes and key is 48 bytes, so data_size + 113 < shard_size
mtu_size = 1500 # default in most AP or routers

[retransmission]
port = 50053 # retransmission port for unicast
wifi_multicast = true
wifi_unicast = true
interval = 15 # in miliseconds

[prometheus]
port = 9186 # bind prometheus to all interfaces

[settings]
timeout_clients = 1 # in seconds
transmissions_interval = 100 # in miliseconds