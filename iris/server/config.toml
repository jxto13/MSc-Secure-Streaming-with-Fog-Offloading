[ca]
c = "PT"
st = "Porto"
o = "DCC"
cn = "iris.dcc.fc.up.pt"

[server_cert]
c = "PT"
st = "Porto"
o = "DCC"
cn = "stream1.iris.dcc.fc.up.pt"

[grpc]
port = 50051 # service port

[unicast]
port = 50052 # unicast port for retransmissions

[multicast]
# Stream Config
data_source = "mpegts"

# This ip source is for docker network
# ip_source = "172.22.0.102:1234"

# This ip source is local development
ip_source = "172.22.0.1:1234"

# Multicast Config
interface = "host-br" 
# interface = "wlp92s0"
# interface = "eth0"
# interface = "enp0s20f0u3u1u2"

ip_multicast = "239.255.0.1"
port_multicast = 50050 # port for multicast stream

bitrate = 3000 # kbit/s

# Matrix Config
row = 10
col = 10
row_fec = 0 # can be 0 if network loss allows it
col_fec = 0 # can be 0 if network loss allows it

epoch = 10 # number of matrix to rotate encryption key

# This is the protocol defined, this is optimized for MTU 1500, can be easily changed with another MTU size
data_size = 940 # 188 x 5, this is 5 ts packets
shard_size = 1088 # must be a multiple of 64 but needs to be bigger then data and have space for signatures and next_key, 
                  # max size of signature is 65 bytes and key is 48 bytes, so data_size + 113 < shard_size
mtu_size = 1500 # default in most AP or routers

[retransmission]
wifi_multicast = true
wifi_unicast = true
unicast_bitrate = 1000 # kbit/s, this is the bitrate for unicast retransmissions per client, this is the maximum bitrate that the server will use to retransmit data to clients
interval = 500 # in miliseconds, this is the time between retransmissions rounds
deadline = 1000 # in miliseconds, this is the time before a matrix is not considered valid for retransmissions
port = 50053 # port for report sink, this is the port that the clients will send reports to the server

[prometheus]
port = 9186 # bind prometheus to all interfaces

[settings]
timeout_clients = 5000 # in miliseconds
client_reporting_interval = 200 # in miliseconds
client_sliding_window = 5 # number of reports that will be send to the server before the client decodes the data to application layer