plugins {
    id 'com.android.application'
    id 'org.mozilla.rust-android-gradle.rust-android' version '0.9.3'
    id "com.google.protobuf" version "0.9.4"
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pt.iris'
    compileSdk 34
    ndkVersion '27.0.11718014'

    defaultConfig {
        applicationId "pt.iris"
        minSdk 31
        //noinspection EditedTargetSdkVersion,OldTargetApi
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            proto {
                // In addition to the default 'src/main/proto'
                srcDir '../../iris/proto'
            }
        }
    }

    protobuf {
        protoc {
            artifact = 'com.google.protobuf:protoc:3.22.3'
        }
        plugins {
            grpc {
                artifact = 'io.grpc:protoc-gen-grpc-java:1.59.0'
            }
        }
        generateProtoTasks {
            all().each { task ->
                task.builtins {
                    java { option 'lite' }
                }
                task.plugins {
                    grpc { option 'lite' }
                }
            }
        }
    }

    // Define the source and destination paths
    def srcPath = '../../iris/certs/ca_certificate.pem'
    def destPath = 'src/main/assets' // This is an example path inside the APK

    // Task to copy the certificate file
    task copyCertificate(type: Copy) {
        from srcPath
        into destPath // Destination directory in your APK structure
        rename { String fileName ->
            "ca_certificate.pem" // Rename if necessary
        }
    }

    // Ensure the copy task runs before assembling the APK
    preBuild.dependsOn(copyCertificate)
}


dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    implementation 'io.grpc:grpc-okhttp:1.65.1'
    implementation 'io.grpc:grpc-stub:1.65.1'
    implementation 'io.grpc:grpc-protobuf-lite:1.65.1'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-cronet:1.4.1'

    compileOnly 'org.apache.tomcat:annotations-api:6.0.53' // necessary for Java 9+
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

cargo {
    module  = './src/main/rust'
    libname = 'irislinker'
    // Because we use Cargo Workspaces the target directory is in the root of repo
    targetDirectory = '../../target'
    profile = gradle.startParameter.taskNames.any{it.toLowerCase().contains("debug")} ? "debug" : "release"
    targets = ['arm64'] // 'arm', 'arm64', 'x86', 'x86_64'
    prebuiltToolchains = true
    exec { spec, toolchain ->
        if (toolchain.target == "aarch64-linux-android") {
            // Add missing toolchain variable to compile openssl-sys
            // If error try to specify from this link "https://developer.android.com/ndk/guides/other_build_systems"
            spec.environment("RANLIB","/opt/android-sdk/ndk/" + android.ndkVersion + "/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib")
            spec.environment("CC","/opt/android-sdk/ndk/" + android.ndkVersion + "/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android"+ android.defaultConfig.targetSdk + "-clang")

        }
    }
    //verbose = true
}

preBuild.dependsOn 'cargoBuild'