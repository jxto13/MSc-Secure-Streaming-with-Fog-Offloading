[package]
name = "irislinker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
jni = "0.21.1"
android_logger = "0.14.1"
log = "0.4.22"
iris-client = { version = "0.1.0", path = "../../../../../iris/client" }
mio = { version = "1.0.2", features = ["os-poll", "net"] }
libc = "0.2.157"
crossbeam-channel = "0.5.13"


[profile.release]
codegen-units = 1
lto = true
strip = true
