syntax = "proto3";
package streaming_server;

// Certicastes
service CertificateService {
    rpc SignCertificate(CertificateRequest) returns (CertificateResponse);
    rpc VerifyCertificate(SignedCertificateRequest) returns (ValidationCertificateResponse);

}

message SignedCertificateRequest {
    bytes cert = 1; 
}

message ValidationCertificateResponse { 
    bool auth = 1;
}

message CertificateRequest {
    bytes csr = 1;
}

message CertificateResponse {
    bytes signed_cert = 1;
}
// ----------------------------------------------------------------------------------------------------------- //

// Symmetric keys
service KeyService {
    rpc RequestCurrentKey(RequestKey) returns (KeyResponse);
}

message RequestKey {}

message KeyResponse {
    SessionKey current_key = 1;
    bytes certificate = 2;
}

// ----------------------------------------------------------------------------------------------------------- //

// Session Key
message SessionKey {
    bytes key = 1;
    bytes iv = 2;
}

// This will be the payload of TransmitionPacket
message VideoData {
    bytes data = 1;
    bytes signature = 2;
    SessionKey next_key = 3;
}

message TransmitionPacket {
    int32 matrix = 1;
    int32 index = 2;
    int32 rows = 3;
    int32 cols = 4;
    int32 rows_fec = 7;
    int32 cols_fec = 8;
    bytes payload = 9; // this payload is encrypted
    bytes packet_signature = 10; // signed sha256
}

// ----------------------------------------------------------------------------------------------------------- //

// Reporting Service
service ReportService {
    rpc SendReport (ClientReport) returns (Empty);
}

message Empty {}

message ClientReport {
    int32 index = 1;
    bytes payload = 2;
}


message StatMessage{
    uint64  total_packets_received = 1;
    uint64  total_packets_received_size = 2;
    uint64  total_multicast_packets_received = 3;
    uint64  total_multicast_packets_received_size = 4;
    uint64  total_unicast_packets_received = 5;
    uint64  total_unicast_packets_received_size = 6;
    uint64  total_ack_packets = 7;
    uint64  total_ack_packets_size = 8;
    uint64  current_time = 9;
};