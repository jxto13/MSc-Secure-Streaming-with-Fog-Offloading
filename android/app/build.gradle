plugins {
    id 'com.android.application'
    id 'org.mozilla.rust-android-gradle.rust-android' version '0.9.6'
    id "com.google.protobuf" version "0.9.5"
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pt.iris'
    compileSdk 36
    ndkVersion "29.0.13599879"

    defaultConfig {
        applicationId "pt.iris"
        minSdk 32
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            proto {
                // In addition to the default 'src/main/proto'
                srcDir '../../iris/proto'
            }
        }
    }

    protobuf {
        protoc {
            artifact = 'com.google.protobuf:protoc:3.22.3'
        }
        plugins {
            grpc {
                artifact = 'io.grpc:protoc-gen-grpc-java:1.59.0'
            }
        }
        generateProtoTasks {
            all().each { task ->
                task.builtins {
                    java { option 'lite' }
                }
                task.plugins {
                    grpc { option 'lite' }
                }
            }
        }
    }
}


dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.3'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'

    implementation 'io.grpc:grpc-okhttp:1.75.0'
    implementation 'io.grpc:grpc-stub:1.75.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.75.0'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'

    implementation("androidx.media3:media3-exoplayer:1.8.0")
    implementation("androidx.media3:media3-exoplayer-dash:1.8.0")
    implementation("androidx.media3:media3-ui:1.8.0")
    implementation("androidx.media3:media3-ui-compose:1.8.0")

    compileOnly 'org.apache.tomcat:annotations-api:6.0.53' // necessary for Java 9+
}

cargo {
    module  = './src/main/rust'
    libname = 'irislinker'
    // Because we use Cargo Workspaces the target directory is in the root of repo
    targetDirectory = '../../target'
    profile = 'release'
    targets = ['arm64'] // 'arm', 'arm64', 'x86', 'x86_64'
    prebuiltToolchains = true
    exec { spec, toolchain ->
        if (toolchain.target == "aarch64-linux-android") {
            // Add missing toolchain variable to compile openssl-sys
            // If error try to specify from this link "https://developer.android.com/ndk/guides/other_build_systems"
            spec.environment("RANLIB","/opt/android-sdk/ndk/" + android.ndkVersion + "/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib")
            spec.environment("CC","/opt/android-sdk/ndk/" + android.ndkVersion + "/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android"+ android.defaultConfig.targetSdk + "-clang")

        }
    }
    //verbose = true
}

preBuild.dependsOn 'cargoBuild'