syntax = "proto3";
package streaming_server;

// ----------------------------------------------------------------------------------------------------------- //

// Certificates
service CertificateService {
    rpc SignCertificate(CertificateRequest) returns (CertificateResponse);
    rpc VerifyCertificate(SignedCertificateRequest) returns (ValidationCertificateResponse);
}

message SignedCertificateRequest {
    bytes cert = 1; 
}

message ValidationCertificateResponse { 
    bool auth = 1;
}

message CertificateRequest {
    bytes csr = 1;
}

message CertificateResponse {
    bytes signed_cert = 1;
}

// ----------------------------------------------------------------------------------------------------------- //

// Symmetric keys
service KeyService {
    rpc RequestCurrentKey(RequestKey) returns (KeyResponse);
}

message BiggyBackData {
    uint32 epoch = 1; // this is the number of matrix to rotate the key
    uint32 client_reporting_interval = 2; // this is the interval in seconds to send client reports
    uint32 client_sliding_window = 3;  // this is the sliding window size for client reports
    uint32 retransmission_port = 4; // this is the port for retransmission packets
    uint32 unicast_port = 5; // this is the port for unicast packets
    string multicast_address = 6; // this is the address for multicast packets
    uint32 multicast_port = 7; // this is the port for multicast packets
}

message RequestKey {}

message KeyResponse {
    SessionKey current_key = 1;
    SessionKey next_key = 2;
    bytes certificate = 3;
    BiggyBackData biggy_back_data = 4; // this is the data to know when to send client reports
}

// ----------------------------------------------------------------------------------------------------------- //

// Session Key
message SessionKey {
    bytes key = 1;
    bytes iv = 2;
}

// This will be the payload of TransmissionPacket
message VideoData {
    bytes data = 1;
    bytes signature = 2;
    SessionKey next_key = 3;
}

message TransmissionPacket {
    uint32 matrix = 1;
    uint32 index = 2;
    uint32 rows = 3;
    uint32 cols = 4;
    uint32 rows_fec = 7;
    uint32 cols_fec = 8;
    bytes payload = 9; // this payload is encrypted
    bytes packet_signature = 10; // signed sha256
}

// RetransmissionPacket is a packet with a single TransmissionPacket 
message RetransmissionPacket {
    // probably will need a array saying what packets is on the linear combination
    TransmissionPacket packet = 1;
}

// PacketWrapper is a wrapper for the packets to allow for different types of packets
message PacketWrapper {
  oneof packet_type {
    TransmissionPacket transmission_packet = 1;
    RetransmissionPacket retransmission_packet = 2;
  }
}

// ----------------------------------------------------------------------------------------------------------- //

// Reporting Service
service ReportService {
    rpc ReportSink (ClientReport) returns (TimestampResponse);
}

message MatrixReportBitmap {
    uint32 matrix_index = 1;
    bytes bitmap = 2; // only sends data row and collumn bitmap
}

message ClientReport {
    bytes client_id = 1; // this is the client id
    uint32 counter = 2; // this is the counter to prevent replay attacks
    repeated MatrixReportBitmap reports = 3; // this is the bitmap of the matrix
    bytes signature = 4; // signed sha256
}

// ----------------------------------------------------------------------------------------------------------- //

service NtsService {
    rpc GetCurrentTimestamp (TimestampRequest) returns (TimestampResponse);
}
  
message TimestampRequest {}

message TimestampResponse {
    string timestamp = 1;
}