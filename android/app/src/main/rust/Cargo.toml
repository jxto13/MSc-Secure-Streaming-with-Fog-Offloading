[package]
name = "irislinker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
jni = "0.21.1"
android_logger = "0.15.0"
log = "0.4.22"

iris-client = { version = "0.1.0", path = "../../../../../iris/client" }
mio = { version = "1.0.2", features = ["os-poll", "net"] }
crossbeam-channel = "0.5.13"
# pnet = "0.35.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3.31"
prost = "0.14.1"
once_cell = "1.21.3"
uuid = { version = "1.17.0", features = ["v4"] }
pnet_datalink = "0.35.0"
socket2 = "0.6.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
