[ca]
c = "PT"
st = "Porto"
o = "DCC"
cn = "www.iris.dcc.fc.up.pt"

[grpc]
port = 50051 # service port

[multicast]
# Stream Config
data_source = "ffmpeg" # can be 'ffmpeg' or 'file'

# Configuration when data_source is 'file'
file_path = "./public/demo.ts"

# Configuration when data_source is 'ffmpeg'
ffmpeg_input = "/dev/video0"  # example input source, adjust as needed
ffmpeg_options = "-c:v libx264 -preset ultrafast -tune zerolatency"

interface = "wlp92s0"
ip = "239.255.0.1"
port = 12345

# Matrix Config
row = 10
col = 10
row_fec = 5 # can be 0 with network loss allows it
col_fec = 5 # can be 0 with network loss allows it

epoch = 20 # number of matrix to rotate encryption key

max_bandwidth = 100 # Mbit/s 


# This is the protocol defined, this is optimized for MTU 1500, can be easily changed with another MTU size
data_size = 1128 # 188 x 6, this is 6 ts packets
shard_size = 1280 # must be a multiple of 64 but needs to be bigger then data and have space for signatures and next_key, max size of signature is 65 bytes and key is 48 bytes, so data_size + 113 < shard_size
mtu_size = 1500 # default in all AP or routers
