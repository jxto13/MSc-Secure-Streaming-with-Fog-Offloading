syntax = "proto3";
package helloworld;

service Greeter {
    rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
   string name = 1;
}

message HelloReply {
    string message = 1;
}


// EchoRequest is the request for echo.
message EchoRequest {
    string message = 1;
  }

// EchoResponse is the response for echo.
message EchoResponse {
    string message = 1;
}

// ----------------------------------------------------------------------------------------------------------- //

// Multicast UDP Packet
message DataPacket {
    int32 matrix = 1;
    int32 index = 2;
    int32 width = 3;
    int32 height = 4;
    bool fec = 5;
    bytes data = 6;
    // bytes signature = 7;
}

message IrisPacket {
    repeated DataPacket payload = 1;
    // bytes signature = 7;
}

// ----------------------------------------------------------------------------------------------------------- //
