[package]
name = "irislinker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
jni = "0.21.1"
android_logger = "0.14.1"
log = "0.4.22"
iris = { version = "0.1.0", path = "../../../../../iris" }
mio = { version = "1.0.2", features = ["os-poll", "net"] }
libc = "0.2.157"
tokio = "1.39.3"
mpeg2ts = "0.3.1"


[profile.release]
codegen-units = 1
lto = true
strip = true
