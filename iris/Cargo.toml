[package]
name = "iris"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
env_logger = "0.11.3"
log = "0.4.21"
tokio-util = { version = "0.7.0", features = ["full"] }
tokio = { version = "1.28.2", features = ["macros", "rt-multi-thread"] }
tonic-reflection = "0.12.0"
tonic = { version =  "0.12.0", features = ["transport", "tls"] }
mio = "0.8.11"
openssl = "0.10.64"
prost = "0.13.1" # tonic uses this, but needs a trait implementation todo!()
reed-solomon-16  = "0.1.0"
grid = "0.14.0"
rayon = "1.10"
crossbeam-channel = "0.5.13"
crossbeam-queue = "0.3.11"

serde = { version = "1.0", features = ["derive"] }
toml = "0.8.13"
clap = "4.5.4"
rand = "0.8.5"
serde_json = "1.0.118"
once_cell = "1.19.0"
pnet = "0.35.0"
pnet_datalink = "0.35.0"

# This compiles openssl for android using NDK
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10.64", features = ["vendored"] }

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "streaming_server"
path = "./src/streaming_server/main.rs"
