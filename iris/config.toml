[ca]
c = "PT"
st = "Porto"
o = "DCC"
cn = "www.iris.dcc.fc.up.pt"

[grpc]
port = 50051

[multicast]
# Stream Config
data_source = "file" # can be 'ffmpeg' or 'file'
file_path = "./public/demo.ts"
interface = "wlp92s0"
ip = "239.255.0.1"
port = 12345

# Matrix Config
row = 10
col = 10
row_fec = 5
col_fec = 5

epoch = 20 # number of matrix to rotate encryption key

max_bandwidth = 100 # Mbit/s 

data_size = 1128 # 188 x 6, this is 6 ts packets
shard_size = 1280 # must be a multiple of 64 but needs to be bigger then data and have space for signatures and next_key, max size of signature is 65 bytes and key is 48 bytes, so data_size + 113 < shard_size
mtu_size = 1472 # default in all AP or routers
